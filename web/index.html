<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rez-pad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>rez-pad</h1>
    <p>Config editor placeholder (Phase 10).</p>
    <dl id="status">
      <dt>Host</dt><dd id="host-ver">...</dd>
      <dt>Protocol</dt><dd id="proto-ver">...</dd>
      <dt>Device</dt><dd id="device">...</dd>
      <dt>Sensors</dt><dd id="sensors">...</dd>
    </dl>
    <h2>Data sources</h2>
    <p class="hint">Everything this PC can show. Sources marked "on device" are in the current layout.</p>
    <table id="sources">
      <thead><tr><th>Source</th><th>Name</th><th class="num">Value</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
