<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rez-pad</title>
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="appbar">
    <a class="brand" href="#" aria-label="rez-pad">
      <svg id="brand-logo" class="logo" viewBox="1 4 30 24" aria-hidden="true">
        <rect x="1" y="5" width="30" height="22" rx="5" fill="#464e5c"/>
        <rect x="2.2" y="6.2" width="27.6" height="19.6" rx="4" fill="#20242c"/>
        <rect class="logo-screen" x="4.5" y="8.5" width="16" height="15" rx="2"/>
        <rect x="6.5" y="11" width="12" height="2.5" rx="1" fill="#000" fill-opacity="0.45"/>
        <rect x="6.5" y="16" width="7.5" height="5" rx="1" fill="#000" fill-opacity="0.45"/>
        <circle cx="25.5" cy="14.5" r="3.2" fill="#c8ced6"/>
        <circle cx="25.5" cy="14.5" r="1.9" fill="#969ca6"/>
        <rect x="25.1" y="11.8" width="0.8" height="2.4" rx="0.4" fill="#20242c"/>
        <circle cx="25.5" cy="21.5" r="2" fill="#c8ced6"/>
      </svg>
      <span class="brand-name">rez-pad</span>
    </a>
    <nav class="views" role="tablist" aria-label="Sections">
      <button type="button" role="tab" data-view="layout" data-icon="layout">Layout</button>
      <button type="button" role="tab" data-view="settings" data-icon="gear">Settings</button>
      <button type="button" role="tab" data-view="device" data-icon="chip">Device</button>
    </nav>
    <div class="spacer"></div>
    <button type="button" id="status-chip" class="device-pill" data-state="wait" title="Device details">
      <span class="pill-dot" aria-hidden="true"></span>
      <span class="pill-text"><strong id="pill-main">Connecting...</strong><small id="pill-sub"></small></span>
    </button>
    <div class="bar-actions">
      <button type="button" id="btn-undo" class="icon-btn" disabled title="Undo (Ctrl+Z)" aria-label="Undo"></button>
      <button type="button" id="btn-redo" class="icon-btn" disabled title="Redo (Ctrl+Y)" aria-label="Redo"></button>
      <button type="button" id="btn-save" class="primary" disabled title="Ctrl+S">Save to device</button>
    </div>
  </header>
  <div id="banner" class="banner" hidden></div>

  <main>
    <section id="view-layout" class="layout" hidden>
      <aside class="rail" aria-label="Pages">
        <div class="rail-head">Pages</div>
        <ol id="page-list" class="page-list"></ol>
        <button type="button" id="page-add" class="ghost wide-btn"></button>
      </aside>

      <section class="stage">
        <div class="stage-head">
          <div id="page-title" class="page-title">
            <button type="button" id="page-name-show" class="page-name-show" title="Rename this page">
              <span id="page-name-text"></span><span class="pencil" aria-hidden="true"></span>
            </button>
            <input id="page-name" class="page-name" aria-label="Page name" maxlength="31" autocomplete="off" spellcheck="false" hidden>
          </div>
          <div id="page-tools" class="page-tools"></div>
        </div>
        <div id="screen-wrap" class="screen-wrap">
          <div id="screen" class="screen" tabindex="0" aria-label="Device screen: drag widgets to move, drag the corner to resize"></div>
        </div>
        <p id="stage-hint" class="stage-hint"></p>
        <section id="page-settings" class="page-settings" aria-label="Page settings"></section>
      </section>

      <aside id="inspector" class="inspector" aria-label="Widgets"></aside>
    </section>

    <section id="view-settings" class="settings-view" hidden></section>
    <section id="view-device" class="settings" hidden></section>
  </main>

  <div id="popover" class="popover" hidden></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
