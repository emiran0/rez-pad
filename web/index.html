<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>rez-pad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>rez-pad</h1>
    <span id="pill-device" class="pill">...</span>
    <span id="pill-sync" class="pill" hidden></span>
  </header>

  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="layout">Layout</button>
    <button type="button" role="tab" data-tab="inputs">Knobs</button>
    <button type="button" role="tab" data-tab="display">Display</button>
    <button type="button" role="tab" data-tab="weather">Weather</button>
    <button type="button" role="tab" data-tab="sensor">Sensor &amp; media</button>
    <button type="button" role="tab" data-tab="device">Device</button>
  </nav>

  <main>
    <section id="tab-layout" class="layout" hidden>
      <div class="layout-main">
        <div id="page-tabs" class="page-tabs" role="tablist" aria-label="Pages"></div>
        <div id="screen-wrap" class="screen-wrap">
          <div id="screen" class="screen" tabindex="0" aria-label="Device screen preview"></div>
        </div>
        <div id="page-props" class="panel"></div>
      </div>
      <aside class="layout-side">
        <div class="panel">
          <h2>Add a widget</h2>
          <div id="palette" class="palette"></div>
        </div>
        <div class="panel">
          <h2>Selected widget</h2>
          <div id="props"></div>
        </div>
      </aside>
    </section>
    <section id="tab-inputs" hidden></section>
    <section id="tab-display" hidden></section>
    <section id="tab-weather" hidden></section>
    <section id="tab-sensor" hidden></section>
    <section id="tab-device" hidden></section>
  </main>

  <footer id="savebar" class="savebar">
    <span id="save-msg" class="save-msg">Loading...</span>
    <button type="button" id="btn-revert" disabled>Undo changes</button>
    <button type="button" id="btn-save" class="primary" disabled title="Ctrl+S">Save to device</button>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
