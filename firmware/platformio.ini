; DeskHub firmware
; Versions verified 2026-11-06:
;   pioarduino platform-espressif32 55.03.312-1 (Arduino-ESP32 core 3.3.12, ESP-IDF 5.5)
; Libraries (LovyanGFX, LVGL, JPEGDEC, ArduinoJson) are added in the phase that first uses them.

[platformio]
default_envs = deskhub

[env]
test_framework = unity

[env:deskhub]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; Espressif DevKitC-1 N16R8: 16 MB QIO flash, 8 MB octal PSRAM (qio_opi), BOARD_HAS_PSRAM defined.
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Upload through the USB-UART bridge port (always available, even when TinyUSB owns the native port).
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=0          ; native port runs TinyUSB (USB-OTG), needed for CDC + HID composite
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial stays on UART0 (bridge port) for debug logs
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"0.1.0\"
build_src_flags =
    -Wall -Wextra
test_ignore = *

; Host-side unit tests for pure C++ libraries (protocol, later config validation).
; Needs a host C++ compiler (gcc/g++ on PATH, e.g. WinLibs/MinGW-w64 on Windows).
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
