; rez-pad firmware
; Versions verified 2026-11-06:
;   pioarduino platform-espressif32 55.03.312-1 (Arduino-ESP32 core 3.3.12, ESP-IDF 5.5)
; Libraries are added in the phase that first uses them:
;   LovyanGFX 1.2.36 (2026-10-30). 1.3.0 (2026-11-06) changed sprite/DMA semantics; we only use pushImageDMA, so stay on 1.2.36.
;   LVGL 9.6.0 (2026-09-16), configured by include/lv_conf.h.
;   ArduinoJson 7.4.3 (2026-03-02) for protocol and config JSON.
;   JPEGDEC 1.8.5 (2026-10-25) for album art. Its library.properties lists bb_spi_lcd (used only by its
;   examples), so that is ignored below.

[platformio]
default_envs = rezpad

[env]
test_framework = unity

[env:rezpad]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
; Espressif DevKitC-1 N16R8: 16 MB QIO flash, 8 MB octal PSRAM (qio_opi), BOARD_HAS_PSRAM defined.
board = esp32-s3-devkitc1-n16r8
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
extra_scripts = pre:scripts/fs_include.py  ; FS include path for Arduino's USB library
lib_ignore = bb_spi_lcd
lib_deps =
    lovyan03/LovyanGFX@1.2.36
    lvgl/lvgl@9.6.0
    bblanchon/ArduinoJson@7.4.3
    bitbank2/JPEGDEC@1.8.5
    FS                 ; framework lib, linked for the USB library and LittleFS (Phase 9)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Upload through the USB-UART bridge port (always available, even when TinyUSB owns the native port).
upload_speed = 921600
build_flags =
    -DARDUINO_USB_MODE=0          ; native port runs TinyUSB (USB-OTG), needed for CDC + HID composite
    -DARDUINO_USB_CDC_ON_BOOT=0   ; Serial stays on UART0 (bridge port) for debug logs
    -DCORE_DEBUG_LEVEL=3
    -DFW_VERSION=\"0.1.0\"
    -DLV_CONF_INCLUDE_SIMPLE      ; LVGL finds include/lv_conf.h
    -Iinclude
build_src_flags =
    -Wall -Wextra
test_ignore = *

; Host-side unit tests for pure C++ libraries (protocol, later config validation).
; Needs a host C++ compiler (gcc/g++ on PATH, e.g. WinLibs/MinGW-w64 on Windows).
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra -DUNITY_INCLUDE_DOUBLE
lib_deps =
    bblanchon/ArduinoJson@7.4.3   ; config_logic (same version as the device)
